name: nethsm-cluster

x-nethsm-healthcheck: &nethsm-healthcheck
  test: ["CMD", "curl", "-f", "-k", "-s", "https://169.254.100.2/api/v1/info"]
  interval: 1s
  timeout: 1s
  retries: 10

services:
  nethsm1:
    hostname: nethsm1
    image: ${NETHSM_IMAGE:-nitrokey/nethsm:testing}
    build:
      context: ../../..
      dockerfile: src/container/alpine/Dockerfile
      target: nethsm_test
    networks:
      nethsm:
        interface_name: eth0
        ipv4_address: 172.22.1.2
        ipv6_address: "fc00:22:1::2"
    # environment: {}
    volumes:
      - "data1:/data"
    cap_add:
      - NET_ADMIN
    healthcheck: *nethsm-healthcheck

  nethsm2:
    hostname: nethsm2
    image: ${NETHSM_IMAGE:-nitrokey/nethsm:testing}
    networks:
      nethsm:
        interface_name: eth0
        ipv4_address: 172.22.1.3
        ipv6_address: "fc00:22:1::3"
    # environment: {}
    volumes:
      - "data2:/data"
    cap_add:
      - NET_ADMIN
    healthcheck: *nethsm-healthcheck

  nethsm3:
    hostname: nethsm3
    image: ${NETHSM_IMAGE:-nitrokey/nethsm:testing}
    networks:
      nethsm:
        interface_name: eth0
        ipv4_address: 172.22.1.4
        ipv6_address: "fc00:22:1::4"
    # environment: {}
    volumes:
      - "data3:/data"
    cap_add:
      - NET_ADMIN
    healthcheck: *nethsm-healthcheck

  nethsm4:
    hostname: nethsm4
    image: ${NETHSM_IMAGE:-nitrokey/nethsm:testing}
    networks:
      nethsm:
        interface_name: eth0
        ipv4_address: 172.22.1.5
        ipv6_address: "fc00:22:1::5"
    # environment: {}
    cap_add:
      - NET_ADMIN
    volumes:
      - "data4:/data"
    healthcheck: *nethsm-healthcheck

  etcd-witness:
    hostname: etcd-wittness
    image: "quay.io/coreos/etcd:v3.6.5"
    networks:
      nethsm:
        interface_name: eth0
        ipv4_address: 172.22.1.10
        ipv6_address: "fc00:22:1::10"
    command: >
      etcd
        --data-dir=/etcd-data
        --listen-peer-urls=https://0.0.0.0:2380
        --max-txn-ops=512
        --peer-auto-tls
    # --cert-file=/run/secrets/etcd_server_cert
    # --key-file=/run/secrets/etcd_server_key
    # --trusted-ca-file=/run/secrets/ca_cert
    volumes:
      - "data-witness:/etcd-data"
    # secrets:
    #   - ca_cert
    #   - etcd_server_cert
    #   - etcd_server_key
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 1s
      timeout: 1s
      retries: 10

networks:
  nethsm:
    enable_ipv6: true
    internal: true
    ipam:
      driver: default
      config:
        - subnet: "fc00:22:1::/48"
        - subnet: "172.22.1.0/24"
volumes:
  data1:
  data2:
  data3:
  data4:
  data-witness:
